version: 2

models:
  - name: int_orders__item_aggregates
    description: "Order items aggregated to order grain. One row per order."
    columns:
      - name: order_id
        description: "Order primary key."
        data_tests: [unique, not_null]
      - name: item_count
        description: "Number of item rows in the order."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
      - name: items_value
        description: "Total item value in BRL."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: freight_value
        description: "Total freight in BRL."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: int_orders__payment_aggregates
    description: "Payments aggregated to order grain. One row per order."
    columns:
      - name: order_id
        description: "Order primary key."
        data_tests: [unique, not_null]
      - name: payment_total
        description: "Total of all payments on the order."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: payment_count
        description: "Number of payment rows."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"

  - name: int_orders__review_aggregates
    description: "Reviews aggregated to order grain, keeping the latest. One row per order."
    columns:
      - name: order_id
        description: "Order primary key."
        data_tests: [unique, not_null]
      - name: latest_review_score
        description: "Score of the most recent review, 1-5."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: review_count
        description: "Number of reviews on the order."
        data_tests:
          - not_null

  - name: int_orders__delivery
    description: "Delivery metrics: delivered flag, delivery days, late flag. One row per order."
    columns:
      - name: order_id
        description: "Order primary key."
        data_tests: [unique, not_null]
      - name: is_delivered
        description: "Whether the order reached the customer."
        data_tests: [not_null]
      - name: is_late
        description: "Whether delivery was later than promised. Null when not delivered, counted as neither on time nor late."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                # dbt_utils prefixes the column name, so this renders as
                # "is_late is null or is_delivered"
                expression: "is null or is_delivered"
      - name: delivery_days
        description: "Days from purchase to delivery. Null when not delivered."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                # renders as "delivery_days is null or delivery_days >= 0"
                expression: "is null or delivery_days >= 0"

  - name: int_customers__order_rollup
    description: "Customer rollup at customer_unique_id (person) grain."
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]
      - name: order_count
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
      - name: lifetime_value
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: int_sellers__order_rollup
    description: "Seller rollup at seller_id grain. Late rate is computed after deduplicating to seller x order."
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
      - name: order_count
        data_tests: [not_null]
      - name: late_rate
        description: "Share of delivered orders that were late, 0-1."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                # renders as "late_rate is null or (late_rate >= 0 and late_rate <= 1)"
                expression: "is null or (late_rate >= 0 and late_rate <= 1)"

unit_tests:
  - name: is_late_covers_late_on_time_and_undelivered
    description: "Late, on time, and never delivered are three different outcomes; the boundary case sits at midnight."
    model: int_orders__delivery
    given:
      - input: ref('stg_olist__orders')
        rows:
          - {order_id: a1, purchased_at: '2018-01-01 09:00:00', estimated_delivery_at: '2018-01-10 00:00:00', delivered_to_customer_at: '2018-01-11 10:00:00'}
          - {order_id: a2, purchased_at: '2018-01-01 09:00:00', estimated_delivery_at: '2018-01-10 00:00:00', delivered_to_customer_at: '2018-01-09 23:59:00'}
          - {order_id: a3, purchased_at: '2018-01-01 09:00:00', estimated_delivery_at: '2018-01-10 00:00:00', delivered_to_customer_at: null}
    expect:
      rows:
        - {order_id: a1, is_delivered: true, is_late: true, days_late: 1}
        - {order_id: a2, is_delivered: true, is_late: false, days_late: 0}
        - {order_id: a3, is_delivered: false, is_late: null, days_late: null}
