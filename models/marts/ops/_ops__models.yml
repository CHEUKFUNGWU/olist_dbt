version: 2

models:
  - name: mart_ops__delivery_sla
    description: "Delivery performance, grain month_start + state."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['month_start', 'state']
    columns:
      - name: order_count
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
      - name: delivered_orders
        description: "Delivered orders in the cell. Denominator of late_rate."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= order_count"
      - name: late_orders
        description: "Delivered orders that arrived after the promised date. Numerator of late_rate; kept as a column so the rate can be re-aggregated correctly."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= delivered_orders"
      - name: late_rate
        description: "late_orders / delivered_orders. Never average this across rows; sum the two components and divide."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                # renders as "late_rate is null or (late_rate >= 0 and late_rate <= 1)"
                expression: "is null or (late_rate >= 0 and late_rate <= 1)"
