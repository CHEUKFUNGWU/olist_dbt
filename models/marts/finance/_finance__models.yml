version: 2

models:
  - name: mart_finance__monthly_revenue
    description: "Monthly revenue, grain month_start + category_en."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['month_start', 'category_en']
    columns:
      - name: revenue
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: order_count
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
