version: 2

sources:
  - name: olist
    description: "Kaggle Brazilian E-Commerce Public Dataset by Olist. The nine CSVs are loaded as-is into the raw schema by load/load_raw.sql."
    database: olist          # DuckDB catalog = the file name olist.duckdb
    schema: raw
    tables:
      - name: orders
        identifier: olist_orders_dataset
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
      - name: order_items
        identifier: olist_order_items_dataset
      - name: order_payments
        identifier: olist_order_payments_dataset
      - name: order_reviews
        identifier: olist_order_reviews_dataset
      - name: customers
        identifier: olist_customers_dataset
      - name: sellers
        identifier: olist_sellers_dataset
      - name: products
        identifier: olist_products_dataset
      - name: geolocation
        identifier: olist_geolocation_dataset
      - name: category_translation
        identifier: product_category_name_translation
